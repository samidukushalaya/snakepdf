<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>C Snake WASM</title>

    <style>
        body {
            background: #111;
            color: white;
            font-family: sans-serif;
            text-align: center;
        }

        canvas {
            border: 3px solid white;
            background: black;
            image-rendering: pixelated;
        }

        #status {
            margin-top: 10px;
            font-size: 20px;
        }
    </style>
</head>

<body>

<h1>C Brain Snake</h1>

<canvas id="game"></canvas>

<div id="status">
    Snake size: <span id="score">0</span>
</div>

<button id="restart">Restart</button>

<script>

var Module = {

    onRuntimeInitialized: function() {

        console.log("WASM loaded");

        Module.ccall(
            "initGame",
            null,
            [],
            []
        );

        setupCanvas();
        drawGame();

        setInterval(function() {

            Module.ccall(
                "updateGame",
                null,
                [],
                []
            );

            drawGame();

        }, 400);
    }
};


const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let cellSize = 30;


function setupCanvas()
{
    const width = Module.ccall(
        "getWidth",
        "number",
        [],
        []
    );

    const height = Module.ccall(
        "getHeight",
        "number",
        [],
        []
    );

    canvas.width = width * cellSize;
    canvas.height = height * cellSize;
}


function drawGame()
{
    const width = Module.ccall(
        "getWidth",
        "number",
        [],
        []
    );

    const height = Module.ccall(
        "getHeight",
        "number",
        [],
        []
    );


    /* Clear canvas */

    ctx.fillStyle = "black";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* Draw cells */

    for (let y = 0; y < height; y++) {

        for (let x = 0; x < width; x++) {

            const cell = Module.ccall(
                "getCell",
                "number",
                ["number", "number"],
                [x, y]
            );


            const px = x * cellSize;
            const py = y * cellSize;


            if (cell === 35) {
                // #
                ctx.fillStyle = "#444";

                ctx.fillRect(
                    px,
                    py,
                    cellSize,
                    cellSize
                );
            }

            else if (cell === 79) {
               ctx.font = "26px sans-serif";
               ctx.textAlign = "center";
               ctx.textBaseline = "middle";

               ctx.fillText(
                   "🧠",
                 px + cellSize / 2,
                 py + cellSize / 2
    );
}


            else if (cell === 111) {
              ctx.font = "24px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.fillText(
        "🧠",
        px + cellSize / 2,
        py + cellSize / 2
                );
            }


            else if (cell === 64) {
            ctx.font = "24px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.fillText(
        "🍎",
        px + cellSize / 2,
        py + cellSize / 2
    );
            }
        }
    }


    /* Score */

    const size = Module.ccall(
        "getSnakeSize",
        "number",
        [],
        []
    );

    document.getElementById("score").textContent = size;


    /* Game over */

    const gameOver = Module.ccall(
        "isGameOver",
        "number",
        [],
        []
    );

    if (gameOver) {

        document.getElementById("status").textContent =
            "GAME OVER — Snake size: " + size;
    }
}




document.addEventListener("keydown", function(event) {

    let x = 0;
    let y = 0;


    switch (event.key) {

        case "ArrowUp":
            y = -1;
            break;

        case "ArrowDown":
            y = 1;
            break;

        case "ArrowLeft":
            x = -1;
            break;

        case "ArrowRight":
            x = 1;
            break;

        default:
            return;
    }


    event.preventDefault();


    Module.ccall(
        "setDirection",
        null,
        ["number", "number"],
        [x, y]
    );

});

document.getElementById("restart").addEventListener("click", function() {

    Module.ccall(
        "initGame",
        null,
        [],
        []
    );

    // Reset the status text
    document.getElementById("status").innerHTML =
        'Snake size: <span id="score">0</span>';

    // Draw the new game
    drawGame();
});

</script>

<script src="snake.js"></script>

</body>
</html>
